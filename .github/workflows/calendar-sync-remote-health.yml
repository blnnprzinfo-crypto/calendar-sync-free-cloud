name: Calendar sync remote health

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Forzar un fallo sintetico para probar la alerta por email sin tocar datos reales'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  remote-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts
      - run: node scripts/PRODUCTION/diagnostics/calendar-sync-remote-healthcheck.js
        env:
          CALENDAR_SYNC_SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          CALENDAR_SYNC_WORKFLOW_FILE: calendar-sync.yml
          CALENDAR_SYNC_REMOTE_HEALTH_MAX_SCHEDULE_GAP_MINUTES: '20'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALENDAR_SYNC_LOCK_CALENDAR_ID: ${{ secrets.CALENDAR_SYNC_LOCK_CALENDAR_ID }}
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALDAV_BASE_URL: https://caldav.icloud.com/
          GOOGLE_CALENDAR_AUTH_MODE: service_account
          GOOGLE_CALENDAR_SCOPE: https://www.googleapis.com/auth/calendar.readonly
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      - name: Alert on remote health failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.CALENDAR_SYNC_ALERT_SMTP_USER }}
          password: ${{ secrets.CALENDAR_SYNC_ALERT_SMTP_PASSWORD }}
          to: ${{ secrets.CALENDAR_SYNC_ALERT_EMAIL_TO }}
          from: Calendar Sync Bot <${{ secrets.CALENDAR_SYNC_ALERT_SMTP_USER }}>
          subject: "[calendar-sync] REMOTE HEALTH CHECK FAILED"
          body: "calendar-sync-remote-health.yml detecto un problema independiente de cualquier run individual de sync. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
