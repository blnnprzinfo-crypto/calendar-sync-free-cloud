name: One-time cleanup Cuenca Friday 2026-10-16

on:
  pull_request:
    paths:
      - 'scripts/PRODUCTION/maintenance/cleanup-cuenca-friday-20261016.js'
      - 'scripts/QA/tests/calendar/test-cleanup-cuenca-friday.js'
      - '.github/workflows/cleanup-cuenca-friday-20261016.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-cuenca-friday-20261016.yml'

concurrency:
  group: calendar-sync-single-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NODE_ENV: production
      TZ: Europe/Madrid
      CALENDAR_SYNC_MAP_JSON: ${{ secrets.CALENDAR_SYNC_MAP_JSON }}
      CALENDAR_SYNC_EXPECTED_MAPPING_COUNT: ${{ secrets.CALENDAR_SYNC_EXPECTED_MAPPING_COUNT }}
      CALENDAR_SYNC_ENFORCE_ALLOWLIST: 'true'
      CALENDAR_SYNC_ALLOWED_ICLOUD_NAMES_JSON: ${{ secrets.CALENDAR_SYNC_ALLOWED_ICLOUD_NAMES_JSON }}
      CALENDAR_SYNC_ALLOWED_GOOGLE_IDS_JSON: ${{ secrets.CALENDAR_SYNC_ALLOWED_GOOGLE_IDS_JSON }}
      CALENDAR_SYNC_LOCK_CALENDAR_ID: ${{ secrets.CALENDAR_SYNC_LOCK_CALENDAR_ID }}
      CALENDAR_SYNC_LOCK_ALLOW_CREATE: 'false'
      CALENDAR_SYNC_LOCK_TTL_SECONDS: '600'
      ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
      ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
      ICLOUD_CALDAV_BASE_URL: https://caldav.icloud.com/
      GOOGLE_CALENDAR_AUTH_MODE: service_account
      GOOGLE_CALENDAR_SCOPE: https://www.googleapis.com/auth/calendar
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts
      - name: Test calendar sync and exact cleanup allowlist
        env:
          CALENDAR_SYNC_EXPECTED_MAPPING_COUNT: ''
          CALENDAR_SYNC_ENFORCE_ALLOWLIST: 'false'
        run: |
          npm test
          node --check scripts/PRODUCTION/maintenance/cleanup-cuenca-friday-20261016.js
          node scripts/QA/tests/calendar/test-cleanup-cuenca-friday.js
      - name: Preflight (read only)
        run: node scripts/PRODUCTION/maintenance/cleanup-cuenca-friday-20261016.js
      - name: Backup and remove both copies (one-time main merge)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CUENCA_CLEANUP_APPLY: 'true'
          CALENDAR_SYNC_WRITER_ID: cuenca-friday-cleanup
        run: node scripts/PRODUCTION/maintenance/cleanup-cuenca-friday-20261016.js --apply
