name: Validate calendar sync fix

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/calendar-sync-fix-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
