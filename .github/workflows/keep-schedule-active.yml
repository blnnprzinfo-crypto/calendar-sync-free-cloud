name: Keep scheduled workflows active

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Record public repository activity
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > runtime/keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/keepalive.txt
          git commit -m 'chore: keep scheduled sync active' || exit 0
          git push
